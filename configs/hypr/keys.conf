# The mac's hyprshit keys (~/tower/forge/hyprshit/config/keys), copied line by line on 2026-10-16
# so the two boxes can be compared and caught up. Every mac line is here, in the mac's order:
#   live          — bound in this file
#   = hyprland.conf — the mini already answers it there, so it stays a comment here (a second
#                   bind on the same chord would fire twice)
#   no …          — the app or the mechanism does not exist on the mini; kept as a comment
# Translation: alt → SUPER ($mainMod), cmd and ctrl → CTRL (cmd is ctrl+shift inside kitty).
# Letters are bound by keycode (code:N) because keyd types Gallium and Russian moves keysyms.

# ── launcher
# alt-space launch apps                     = hyprland.conf (the launcher)
# alt-shift-space launch menu               no: the front app's menus are a macOS thing
# cmd-= launch tray                         no tray on the mini
# ctrl-= key cmd-=                          no need: cmd and ctrl are the same CTRL here
# ctrl-- key cmd--                          no need, same
# alt-tab launch windows                    = hyprland.conf (winswitch)
# f13 dictate toggle                        = hyprland.conf (dictated.py toggle)
# shift-f13 launch dictate                  no dictation menu in the house boxes yet
# ctrl-alt-cmd-g launch clip                = hyprland.conf on alt+g (one chord, not the mac's three-modifier one)
# ctrl-shift-n summon Arc                   no Arc on the mini

# ── workspaces
# alt-1 … alt-9, alt-[ alt-] alt-f19 alt-f13…f17 alt-k alt-esc   = hyprland.conf
# ctrl-right ws next / ctrl-left ws prev    = keyd + hyprland.conf: keyd's [control] sends
#                                           physical ctrl+arrow as the $fuck chord, bound to
#                                           workspace e±1; cmd+arrow stays home/end, alt+arrow
#                                           the word jump, as on the mac
bind = $mainMod, code:49, togglespecialworkspace           # alt-` ws special
bind = $mainMod SHIFT, code:49, movetoworkspace, special   # alt-shift-` move special

# ── throw the window and follow it
# alt-shift-1 … alt-shift-0, [ ] f19 f13…f17 k esc            = hyprland.conf

# ── express lanes
# alt-n app Arc                             = hyprland.conf: zen (zen-lane), the mini's Arc
# alt-w app kitty                           = hyprland.conf
# alt-s app bare                            = hyprland.conf
# alt-m, alt-c, alt-r                       freed on the mac too (2026-10-16, under one use a day)
bind = $mainMod, code:40, exec, $bin/focus-or-launch '(?i)augury' $bin/augury   # alt-d app augury
# alt-shift-m app Mimestream                no Mimestream (macOS only)
# alt-shift-z app ZMK Studio                no ZMK Studio app; zmkctl does its job here
# alt-e exec finder-here                    no file manager; yazi in kitty is the candidate
# alt-shift-e close Finder windows          no Finder
# alt-z place full                          = hyprland.conf (maximize)
# alt-j exec jot-toggle.sh                  no jot on the mini
# alt-shift-p exec span-play                no span-play on the mini
# ctrl-alt-cmd-shift-f15 dim the built-in   no built-in display (the Lily58's FUCK+d)
bind = CTRL SHIFT $mainMod, code:192, exec, $bin/blackout   # ctrl-alt-cmd-shift-f14 dim the Mi Monitor (FUCK+l)

# ── the mode (submap c, opened by alt-cmd-m in hyprland.conf)
# cmd-m nop                                 not needed: nothing on the mini hides a window on cmd+m
# mode esc · 1…0 · [ ] s · h e o a · arrows · g   = hyprland.conf
# mode k move kitty                         not bound: k in the mini's mode closes the window (quit --window)
# mode v notch-kill                         no notch
submap = c
bind = , code:21, exec, $bin/snap center-70                 # mode = place center-70
bind = , code:21, submap, reset
bind = , code:25, exec, ~/tower/forge/hypragain/dictate/dictated.py toggle   # mode w record (superwhisper on the mac)
bind = , code:25, submap, reset
submap = reset

# alt-0 tile-toggle probe                   not bound: alt-0 is workspace 10 here, and tiling is the `tile` switch
