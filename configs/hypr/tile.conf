workspace = w[tv1], gapsout:0, gapsin:0

windowrule {
    name = lone-tile
    match:float = false
    match:workspace = w[tv1]

    border_size = 0
    rounding = 0
}

# alt+z while tiling: a window that fills the screen pops out to a sane size and back,
# one that shares the screen maximizes (`tile z`). Floating keeps hyprland.conf's own bind.
unbind = $mainMod, code:52
bind = $mainMod, code:52, exec, ~/.local/bin/tile z
