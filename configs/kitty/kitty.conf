# ======== внешний вид ========
font_family      JetBrainsMono Nerd Font
font_size        13.0
background_opacity 0.75
dynamic_background_opacity yes
cursor_shape     beam
cursor_blink_interval 0.5
window_padding_width 8

# ======== поведение ========
allow_remote_control yes
listen_on unix:/tmp/kitty-${USER}
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000

# ======== копирование/вставка (с сохранением SIGINT) ========

# ======== вкладки ========
map alt+left  previous_tab
map alt+right next_tab

# ======== сплиты (windows внутри таба) ========
map ctrl+shift+w close_window
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# ======== размер шрифта на лету ========
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# copy-on-select в системный буфер
copy_on_select clipboard

remember_window_size no
initial_window_width 1100
initial_window_height 620

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+t new_tab_with_cwd
map cmd+w close_window
map cmd+n new_os_window_with_cwd
map cmd+d launch --location=vsplit --cwd=current
map cmd+alt+enter launch --location=hsplit --cwd=current
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
