[altgr]

n = f13
k = f13

[fuck]

# Held F20 (the board's pinky hold since the FUCK layer emptied out) plays the old FUCK
# cells. Keys are physical seats; the outputs are what keyd used to turn the baked chords
# into, since layer output never goes back through [main] or the cmd/sup bridges:
# alt as super, ctrl+shift+a as ctrl+shift+Gallium n.

3 = C-M-A-S-3
4 = C-M-A-S-4
w = C-S-M-f14
e = C-S-M-f15
r = C-S-M-f16
a = C-S-n
space = M-grave

[shit]

# Held F18 (the board's outer thumbs since the SHIT layer emptied out) plays the old SHIT
# cells, the way [fuck] does: physical seats in, what keyd used to make of the baked chords
# out. F1-F12 as [main]'s media keys, cmd+k as ctrl+Gallium a, ctrl+l as ctrl+Gallium e,
# alt+cmd+c as [sup+cmd]'s super+ctrl+m (the mode), ctrl+alt+space as ctrl+super+space.


1 = brightnessdown
2 = brightnessup
3 = f3
4 = f4
5 = f5
6 = f6
7 = previoussong
8 = playpause
9 = nextsong
0 = mute
rightbrace = volumedown
leftbrace = volumeup
d = C-a
x = C-e
c = C-M-m
equal = C-M-space
z = capslock
