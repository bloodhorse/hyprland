## keyd config for miniarch (Lily58 Pro) — V2.2, Gallium
##
## Derived from the live /Users/bekh/.config/karabiner/karabiner.json on 2026-08-01,
## profile "Default profile" (the only one, selected=true), rules:
##   - "Gallium Colstag (Lily58 Only) — gated by var 'gallium'"   → the [main] table
##   - "Gallium mod-combos (Lily58, any input source)"            → the [meta] decision
## Every line below was generated from those rules, not typed from memory.
##
## EMERGENCY STOP: Backspace + Escape + Enter, held together, kills keyd.
## Memorise it before you plug the board in. There is no second keyboard on this box.
##
## Structure inherited from the betrayer-era V1.3 config (hypr-keys/keyd/default.conf).
## The architecture was right; only the letter table was stale. In particular the
## spelled-out [meta] table is NOT redundancy — see the [meta] section and
## docs/keyd-era-v1/HOW-IT-WORKS.md.
##
## Where this sits in the stack: the Lily58's ZMK firmware sends plain QWERTY-position
## evdev codes and knows nothing about Gallium. On the mac, Karabiner applies Gallium.
## Here, keyd does. XKB stays plain `us,ru` — the letter arrangement is deliberately
## kept out of it so there is exactly one remap layer to reason about.
##
##
## RESULTING LAYOUT — eyeball this against what you actually type
##
##   physical (what ZMK sends)      what comes out (Gallium Colstag)
##     q w e r t   y u i o p    →     b l d c v   j y o u ,
##     a s d f g   h j k l ;    →     n r t s g   p h a e i
##     z x c v b   n m , . /    →     x q m w z   k f / ; .
##
##   Shift on physical `,` gives `\` (not `?`) — see [shift].
##
## Against published Gallium v2 Colstag (github.com/GalileoBlues/Gallium) this matches
## on 29 of 30 keys. The one deviation is deliberate and comes straight from karabiner:
## published Gallium puts `'` on the physical-comma key; bekh puts `/` there with `\`
## on shift. The apostrophe comes from firmware (`&kp SQT`, HEAVEN+Enter-thumb since the
## 2026-08-01 keymap rework — it used to sit on the base-layer right outer column), so
## it did not need a slot in the main block.
##
## Brought up to the mac's state of 2026-10-10 (V2.2):
##   - Alt chords are NOT Gallium-translated. The board has no physical Alt: every alt
##     chord is a baked LA() cell on the CURSE layer (Space held), and the cell already
##     names the letter it means. The mac stopped translating them on 2026-10-05
##     (karabiner d2de25e); [alt] and [alt+meta] below are the same decision here.
##   - shift+6 → `&` and shift+7 → `?`, LEFT shift only, exactly as the karabiner rules
##     are keyed. The firmware's `&` cell on the shit layer is RS(N7) and relies on
##     right shift sliding past this.
##
## NOT carried over from the mac:
##   - Russian. The [main] table fires on the ЙЦУКЕН layout too, so Russian typing is
##     broken under keyd. Parked by bekh on 2026-10-10. See docs/keyboard-pipeline.md.

[ids]

# Scoped to the Lily58 alone. Nothing else on this machine is touched — the mini has no
# built-in keyboard, so until this board is physically plugged in keyd grabs nothing.
1d50:615e

[main]

# Caps→Esc from V1.3 stays dropped, but the reasoning moved (2026-08-01 firmware
# rework): the base layer still has no capslock — home-row leftmost is LCTRL, Esc has a
# dedicated key top-left — but CURSE+LShift-position now DOES send CAPS. That key is
# deliberate firmware, so it passes through here untouched; remapping it to esc would
# eat it. karabiner has no caps_lock remap either — the rule named "Caps Lock → English
# (ABC)" is misnamed and actually fires on F17. Left commented so nobody re-derives
# this question a third time.
# capslock = esc

leftshift = layer(lshift)

# Gallium Colstag letter table.
q = b
w = l
e = d
r = c
t = v
y = j
u = y
i = o
o = u
p = comma
a = n
s = r
d = t
f = s
h = p
j = h
k = a
l = e
semicolon = i
z = x
x = q
c = m
v = w
b = z
n = k
m = f

# `g` is absent on purpose: Gallium leaves it in the QWERTY position, and karabiner has
# no manipulator for it. An identity line would be noise.

# Punctuation. Gallium rotates the bottom-right three.
comma = slash
dot = semicolon
slash = dot

[shift]

# Right shift lands here; left shift lands in [lshift] below. Everything unmapped falls
# through to [main] and picks up Shift the normal way.
#
# Shift+physical `,` emits a bare backslash, because karabiner does: the shifted form of
# that key is not the shift of its unshifted form.
comma = backslash

[lshift:S]

# Left shift is split out so the number-row swaps below can be left-shift-only, which
# is how the karabiner rules are keyed. It is still a plain Shift for everything else.
comma = backslash
6 = S-7
7 = S-slash

[control]

# Deliberately empty. Unmapped keys fall through to [main], so Ctrl+<physical> arrives
# as Ctrl+<Gallium letter> — Ctrl+physical-R is Ctrl+C. That is exactly what karabiner
# does on the mac ("Gallium mod-combos" maps control+r → control+c), so muscle memory
# carries over untouched.

[alt]

# IDENTITY TABLE (V2.2, 2026-10-10). Without it an alt chord falls through [main] and
# gets Gallium-translated — and the firmware's LA() cells are already the letter they
# mean, so that was a double translation: CURSE + the n seat sent alt+n, keyd made it
# alt+k, and Hyprland's alt-n bind never fired.
#
# Hyprland binds `code:` of the letter's plain-us position, so alt+<letter> from the
# board now lands on the bind for that letter with nothing in between.
q = A-q
w = A-w
e = A-e
r = A-r
t = A-t
y = A-y
u = A-u
i = A-i
o = A-o
p = A-p
a = A-a
s = A-s
d = A-d
f = A-f
h = A-h
j = A-j
k = A-k
l = A-l
semicolon = A-semicolon
z = A-z
x = A-x
c = A-c
v = A-v
b = A-b
n = A-n
m = A-m
comma = A-comma
dot = A-dot
slash = A-slash

[alt+meta]

# Same rule for alt+cmd chords (the firmware sends LA(LG(M)), the mode door). Spelled
# out because both constituent layers define every letter and the winner would
# otherwise depend on which modifier went down first.
q = A-M-q
w = A-M-w
e = A-M-e
r = A-M-r
t = A-M-t
y = A-M-y
u = A-M-u
i = A-M-i
o = A-M-o
p = A-M-p
a = A-M-a
s = A-M-s
d = A-M-d
f = A-M-f
h = A-M-h
j = A-M-j
k = A-M-k
l = A-M-l
semicolon = A-M-semicolon
z = A-M-z
x = A-M-x
c = A-M-c
v = A-M-v
b = A-M-b
n = A-M-n
m = A-M-m
comma = A-M-comma
dot = A-M-dot
slash = A-M-slash
g = A-M-g

[meta]

# THE CMD BRIDGE — mac command-semantics, generalized (V2.1, 2026-08-01).
#
# On the mac, cmd+<letter> follows the LETTER, not the physical key: karabiner's
# "Gallium mod-combos" maps command+<physical r> → command+c, because physical R is
# the key that types `c` under Gallium. V2.0 translated only five keys (copy/paste/
# cut/undo/select-all). But those five are instances of ONE rule:
#
#   cmd + <physical key>  →  Ctrl + <the Gallium letter that key types>
#
# ...and on Linux the ctrl-family IS the cmd-family: ctrl+t new tab, ctrl+w close,
# ctrl+f find, ctrl+1..9 tab switch. So the whole table below is that one rule applied
# to every letter — the cmd-thumb (LGUI) and RGUI become a full mac→linux muscle-memory
# bridge. Each target was resolved mechanically from the [main] table above.
#
# Chain, for the copy key: bekh presses the key he calls "C" → ZMK sends KEY_R →
# keyd sees meta+r → emits Ctrl+C → XKB (plain us) → app copies. Same inversion the
# kanata era hit with `lctl b`: whoever remaps last decides what letter names mean.
#
# No exceptions left among the letters except x (cmd+q, passed through as Super+Q so
# Hyprland can close the window). g was the mode-c gate until the mac moved its door
# to alt-cmd-m on 2026-10-02; cmd+g is find-next again.
#
# Terminals are the other exception, and they are handled outside this file:
# ~/.config/keyd/app.conf (keyd-application-mapper) turns the whole bridge off while
# kitty is focused, so cmd+<letter> reaches kitty as a real Super chord and ctrl+c
# stays what it is.
#
# Super+K note, historical: V2.0 flagged k = C-a as colliding with a Super+code:45
# focus-up bind. That bind family no longer exists (floating model, no directional
# focus — docs/mac-hotkeys.md §9), so the collision dissolved. k = C-a stands.
# Bonus consistency: firmware hardwires LG(K) at CURSE+D, which lands here as
# select-all — one chord, same meaning on both machines.

# numbers — cmd+1..9/0 = tab switching in browsers, same family on ctrl in linux
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
0 = C-0

# letters — C-<gallium letter of the physical key>.
# NO trailing comments on binding lines: keyd parses everything after `=` as the
# action, so `r = C-c  # copy` is an INVALID line that keyd skips with a warning.
# This exact mistake shipped in V2.0 and silently broke all five translated keys —
# caught 2026-08-01 only because the journal was finally read after a reload.
# the five with mac names: r=copy  t=paste  z=cut  b=undo  k=select-all
# other mnemonics:         d=new-tab  f=save  v=close-tab  m=find  x=quit  p=settings
q = C-b
w = C-l
e = C-d
r = C-c
t = C-v
y = C-j
u = C-y
i = C-o
o = C-u
p = C-comma
a = C-n
s = C-r
d = C-t
f = C-s
g = C-g
h = C-p
j = C-h
k = C-a
l = C-e
semicolon = C-i
z = C-x
x = M-q
c = C-m
v = C-w
b = C-z
n = C-k
m = C-f

# punctuation — same rule
comma = C-slash
dot = C-semicolon
slash = C-dot

# NOT spelled out: space, esc, tab, enter, brackets, numbersign etc. fall through
# [main] unmapped and arrive as real Super chords — Hyprland uses Super+Space
# (launcher, = spotlight muscle memory) and Super+Shift+Esc (emergency exit hatch).
