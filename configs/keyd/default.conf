h = A-C-h
j = A-C-j
k = A-C-k
l = A-C-l
semicolon = A-C-semicolon
z = A-C-z
x = A-C-x
c = A-C-c
v = A-C-v
b = A-C-b
n = A-C-n
m = A-C-m
comma = A-C-comma
dot = A-C-dot
slash = A-C-slash
